<!DOCTYPE html>
<html ng-app ="myApp">
<head>
    <meta charset="UTF-8">
    <title>Primera pagina en Angular JS</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="../http/controller.js"></script>

</head>
<body ng-controller="FirstController">
    <input type="text" ng-model="newPost.title" placeholder="Título"><br>
    <textarea ng-model="newPost.body" placeholder="Contenido"></textarea>
    <button ng-click="addPost()">Enviar</button>
    <ul>
        <li ng-repeat="post in posts">
            <h2>{{post.title}}</h2>
            <p>
                {{post.body}}
            </p>
        </li>
    </ul>
</body>
</html>
