<!DOCTYPE html>
<html ng-app="ToDoList">
<head>  
    
    <meta charset="UTF-8">
    <title>Mi primera aplicación Angular JS</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="angular-local-storage.min.js"></script>
    <script src="controller.js"></script>
</head>
<body ng-controller="ToDoController">

    <ul>
        <li ng-repeat="Actividad in todo">
            {{Actividad.descripcion}} -
            {{Actividad.fecha | date: "short"}} -
            <a href="#" ng-click="removeItem(Actividad)">Eliminar</a>
        </li>
    </ul>

    <form ng-submit="AddActv()">
        <input type="text" ng-model="newActv.descripcion" required>
        <input type="datetime-local" ng-model="newActv.fecha" required>
        <input type="submit" value="Guardar actividad">
    </form>

    <button ng-click="Clean()">Limpiar lista</button>

</body>
</html>
