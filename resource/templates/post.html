<div class="post-detail-container">
    <button class="btn btn-back" ng-click="goBack()">← Volver</button>
    
    <article class="post-detail">
        <header class="post-detail-header">
            <h1>{{post.title}}</h1>
            <div class="post-meta">
                <span class="author">Por: {{post.author}}</span>
                <span class="date">{{post.date | date:'dd/MM/yyyy HH:mm'}}</span>
            </div>
        </header>
        
        <div class="post-detail-content">
            <p>{{post.content}}</p>
        </div>
        
        <footer class="post-detail-footer">
            <div class="post-stats">
                <span class="likes">❤ {{post.likes}} likes</span>
            </div>
            
            <div class="post-actions">
                <button class="btn btn-like" ng-click="likePost()">
                    ❤ Me gusta
                </button>
                <button class="btn btn-edit" ng-click="editPost()">
                    ✏ Editar
                </button>
                <button class="btn btn-delete" ng-click="deletePost()">
                    Eliminar Post
                </button>
            </div>
        </footer>
    </article>
</div>
