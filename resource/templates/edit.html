<div class="create-container">
    <h2>Editar Post</h2>
    
    <form ng-submit="savePost()" class="post-form">
        <div class="form-group">
            <label for="title">Título:</label>
            <input type="text" id="title" ng-model="editPost.title" placeholder="Escribe el título del post" required>
        </div>
        
        <div class="form-group">
            <label for="author">Autor:</label>
            <input type="text" id="author" ng-model="editPost.author" placeholder="Tu nombre" required>
        </div>
        
        <div class="form-group">
            <label for="content">Contenido:</label>
            <textarea id="content" ng-model="editPost.content" rows="6" placeholder="Escribe el contenido del post" required></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <button type="button" class="btn btn-secondary" ng-click="cancel()">Cancelar</button>
        </div>
    </form>
</div>
